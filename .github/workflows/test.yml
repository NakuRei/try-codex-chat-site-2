name: OTO tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  oto-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --check core.js
          node --check app.js
      - name: Run unit tests
        run: node --test tests/core.test.cjs
      - name: Install browser test tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tests/requirements.txt
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: |
          CHROMIUM_PATH="$(.venv/bin/python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" \
            .venv/bin/python tests/dom_test.py
